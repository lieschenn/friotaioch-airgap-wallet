name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build AppImage
        if: matrix.target == 'linux'
        run: pnpm run pack:linux
      - name: Build Windows portable app
        if: matrix.target == 'windows'
        run: pnpm run pack:win
      - name: Upload packaged app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: friotaioch-${{ matrix.target }}-release
          path: |
            release/*.AppImage
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download packaged apps
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: friotaioch-*-release
          path: release-assets
          merge-multiple: true
      - name: Create source archive and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --output="release-assets/Friotaioch-AirGap-Wallet-${version}-source.zip" "$GITHUB_SHA"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Friotaíoch AirGap Wallet ${GITHUB_REF_NAME#v}" --generate-notes
